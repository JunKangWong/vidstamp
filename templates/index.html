<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Digital Card Config</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #242832;
    --panel-soft: #2d323f;
    --accent: #6aa3ff;
    --text: #e6e8eb;
    --muted: #9aa3b0;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --border: #353a47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--panel-soft);
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
    font-size: 13px;
  }
  .tab.active {
    background: var(--accent);
    color: #0a0d12;
    border-color: var(--accent);
    font-weight: 600;
  }
  main {
    display: grid;
    grid-template-columns: minmax(340px, 35%) 1fr;
    height: calc(100vh - 53px);
  }
  .controls {
    overflow-y: auto;
    padding: 20px;
    border-right: 1px solid var(--border);
    background: var(--panel);
  }
  .preview-panel {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  .preview-img-wrap {
    flex: 1;
    background: #0d0f13;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .preview-img-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .preview-placeholder {
    color: var(--muted);
    text-align: center;
    padding: 40px;
  }
  .section {
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .field {
    display: grid;
    grid-template-columns: 130px 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .field label {
    color: var(--muted);
    font-size: 13px;
  }
  .field input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .field input[type="number"],
  .field input[type="text"],
  .field select {
    width: 100%;
    padding: 5px 8px;
    background: var(--panel-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .field-slider {
    grid-template-columns: 130px 1fr 70px;
  }
  details {
    margin-bottom: 16px;
  }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 8px;
  }
  .save-row {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  button.primary {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #0a0d12;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: 0.5; cursor: wait; }
  .status-line {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  .status-line.ok { color: var(--ok); }
  .status-line.err { color: var(--err); }
  .preview-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .preview-status .ok { color: var(--ok); }
  .preview-status .updating { color: var(--warn); }
  .sample-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  button.run-btn {
    width: 100%;
    padding: 10px;
    background: #2a7a4b;
    color: #e6e8eb;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    margin-top: 10px;
  }
  button.run-btn:hover { filter: brightness(1.15); }
  button.run-btn:disabled { opacity: 0.5; cursor: wait; }
  .log-panel {
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .log-output {
    background: #0d0f13;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: monospace;
    font-size: 11px;
    height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
    margin: 6px 0 0;
  }
</style>
</head>
<body>

<header>
  <h1>Digital Card Config</h1>
  <div class="tabs">
    <button class="tab active" data-tab="video">Video Banner</button>
    <button class="tab" data-tab="image">Image Card</button>
  </div>
</header>

<main>
  <div class="controls">

    <!-- VIDEO TAB -->
    <div class="tab-pane active" data-pane="video">

      <div class="section">
        <div class="section-title">Sample Text</div>
        <div class="sample-inputs">
          <input type="text" id="sample-name" placeholder="Name" value="Patricia Thomas" />
          <input type="text" id="sample-table" placeholder="Table" value="T1" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Preview Frame</div>
        <div class="field field-slider">
          <label>Fade In At (s)</label>
          <input type="range" id="frame-time-slider" min="0" max="18" step="0.1" />
          <input type="number" id="frame-time-input" data-key="VIDEO_TEXT_ENTRANCE_TIME" step="0.1" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Positioning</div>
        <div class="field">
          <label>Name Y</label>
          <input type="number" data-key="VIDEO_NAME_POS_Y" step="1" placeholder="negative = from bottom" />
        </div>
        <div class="field">
          <label>Table Y</label>
          <input type="number" data-key="VIDEO_TABLE_POS_Y" step="1" placeholder="negative = from bottom" />
        </div>
        <div class="field">
          <label>Name X</label>
          <input type="text" data-key="VIDEO_NAME_POS_X" placeholder="center or pixel offset" />
        </div>
        <div class="field">
          <label>Table X</label>
          <input type="text" data-key="VIDEO_TABLE_POS_X" placeholder="center or pixel offset" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Font</div>
        <div class="field">
          <label>Typeface</label>
          <select data-key="FONT_FILENAME" id="font-select"></select>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Font Sizes</div>
        <div class="field">
          <label>Name (large)</label>
          <input type="number" data-key="VIDEO_NAME_FONT_SIZE" step="1" />
        </div>
        <div class="field">
          <label>Name (medium)</label>
          <input type="number" data-key="VIDEO_NAME_FONT_SIZE_MEDIUM" step="1" />
        </div>
        <div class="field">
          <label>Name (small)</label>
          <input type="number" data-key="VIDEO_NAME_FONT_SIZE_SMALL" step="1" />
        </div>
        <div class="field">
          <label>Table</label>
          <input type="number" data-key="VIDEO_TABLE_FONT_SIZE" step="1" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Font Color</div>
        <div class="field">
          <label>Color</label>
          <input type="text" data-key="VIDEO_FONT_COLOR" placeholder="black, white, #aa8800…" />
        </div>
      </div>

      <details>
        <summary>Adaptive size thresholds</summary>
        <div class="field">
          <label>Medium @ len &gt;</label>
          <input type="number" data-key="VIDEO_NAME_LENGTH_MEDIUM_THRESHOLD" step="1" />
        </div>
        <div class="field">
          <label>Small @ len &gt;</label>
          <input type="number" data-key="VIDEO_NAME_LENGTH_LONG_THRESHOLD" step="1" />
        </div>
      </details>

      <div class="section">
        <div class="section-title">Run</div>
        <div class="field">
          <label>Input CSV</label>
          <select id="video-csv-select"></select>
        </div>
        <div class="field">
          <label>Output Dir</label>
          <input type="text" id="video-output-path" data-key="VIDEO_OUTPUT_PATH" placeholder="./output/digital_video_banner" />
        </div>
        <button class="run-btn" id="run-video-btn">Generate Videos</button>
      </div>
    </div>

    <!-- IMAGE TAB -->
    <div class="tab-pane" data-pane="image">
      <div class="section">
        <div class="section-title">Image Card — Positioning</div>
        <div class="field">
          <label>Name Y</label>
          <input type="number" data-key="IMAGE_NAME_Y" step="1" />
        </div>
        <div class="field">
          <label>Table Y</label>
          <input type="number" data-key="IMAGE_TABLE_Y" step="1" />
        </div>
      </div>
      <div class="section">
        <div class="section-title">Image Card — Font Sizes</div>
        <div class="field">
          <label>Name</label>
          <input type="number" data-key="IMAGE_NAME_FONT_SIZE" step="1" />
        </div>
        <div class="field">
          <label>Table</label>
          <input type="number" data-key="IMAGE_TABLE_FONT_SIZE" step="1" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Run</div>
        <div class="field">
          <label>Input CSV</label>
          <select id="image-csv-select"></select>
        </div>
        <div class="field">
          <label>Output ZIP</label>
          <input type="text" id="image-output-path" data-key="IMAGE_OUTPUT_ZIP_PATH" placeholder="./output/digital_cards.zip" />
        </div>
        <button class="run-btn" id="run-image-btn">Generate Image Cards</button>
      </div>
    </div>

    <div class="save-row">
      <button class="primary" id="save-btn">Save to config.py</button>
      <div class="status-line" id="save-status">All previews are in-memory until you click Save.</div>
    </div>
  </div>

  <div class="preview-panel">
    <div class="preview-status">
      <span>Live preview</span>
      <span id="preview-status">Loading…</span>
    </div>
    <div class="preview-img-wrap">
      <div class="preview-placeholder" id="preview-placeholder">Initialising…</div>
      <img id="preview-img" style="display: none;" alt="Preview" />
    </div>
    <div class="log-panel" id="log-panel" style="display:none">
      <div class="preview-status">
        <span>Generation Log</span>
        <span id="job-status-badge">—</span>
      </div>
      <pre class="log-output" id="job-log"></pre>
    </div>
  </div>
</main>

<script>
const VIDEO_KEYS = [
  "VIDEO_NAME_POS_X", "VIDEO_NAME_POS_Y",
  "VIDEO_TABLE_POS_X", "VIDEO_TABLE_POS_Y",
  "VIDEO_NAME_FONT_SIZE", "VIDEO_NAME_FONT_SIZE_MEDIUM", "VIDEO_NAME_FONT_SIZE_SMALL",
  "VIDEO_NAME_LENGTH_MEDIUM_THRESHOLD", "VIDEO_NAME_LENGTH_LONG_THRESHOLD",
  "VIDEO_TABLE_FONT_SIZE", "VIDEO_FONT_COLOR",
  "VIDEO_TEXT_ENTRANCE_TIME",
  "FONT_FILENAME",
  "VIDEO_OUTPUT_PATH",
];
const IMAGE_KEYS = [
  "IMAGE_NAME_Y", "IMAGE_TABLE_Y",
  "IMAGE_NAME_FONT_SIZE", "IMAGE_TABLE_FONT_SIZE",
  "IMAGE_OUTPUT_ZIP_PATH",
];
const ALL_KEYS = [...VIDEO_KEYS, ...IMAGE_KEYS];

let debounceTimer = null;
let lastObjectURL = null;
let currentValues = {};

const previewImg = document.getElementById("preview-img");
const previewPlaceholder = document.getElementById("preview-placeholder");
const previewStatus = document.getElementById("preview-status");
const saveStatus = document.getElementById("save-status");
const saveBtn = document.getElementById("save-btn");

function getInputsForKey(key) {
  return document.querySelectorAll(`[data-key="${key}"]`);
}

function setKeyValue(key, value) {
  currentValues[key] = value;
  getInputsForKey(key).forEach(el => {
    if (el.type === "number") {
      el.value = (value === "center" || value === null) ? "" : value;
    } else {
      el.value = value;
    }
  });
}

function readKeyValue(key) {
  const inputs = getInputsForKey(key);
  if (inputs.length === 0) return currentValues[key];
  const el = inputs[0];
  if (el.type === "number") {
    if (el.value === "" || el.value === "-") return currentValues[key];
    const n = Number(el.value);
    return Number.isNaN(n) ? el.value : n;
  }
  // text input: keep "center" as string, parse integers, otherwise pass through
  const v = el.value.trim();
  if (v === "") return currentValues[key];
  if (v.toLowerCase() === "center") return "center";
  const n = Number(v);
  return Number.isNaN(n) ? v : n;
}

function collectOverrides() {
  const out = {};
  ALL_KEYS.forEach(key => {
    const v = readKeyValue(key);
    if (v !== undefined && v !== null && v !== "") out[key] = v;
  });
  return out;
}

async function fetchPreview() {
  const name = document.getElementById("sample-name").value || "Sample Name";
  const table_no = document.getElementById("sample-table").value || "T1";
  const at_time = parseFloat(document.getElementById("frame-time-input").value) || null;
  const overrides = collectOverrides();

  previewStatus.textContent = "Updating…";
  previewStatus.className = "updating";

  try {
    const res = await fetch("/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, table_no, at_time, overrides }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    previewImg.src = url;
    previewImg.style.display = "block";
    previewPlaceholder.style.display = "none";
    if (lastObjectURL) URL.revokeObjectURL(lastObjectURL);
    lastObjectURL = url;
    previewStatus.textContent = "Ready · " + new Date().toLocaleTimeString();
    previewStatus.className = "ok";
  } catch (e) {
    previewStatus.textContent = "Error: " + e.message;
    previewStatus.className = "err";
  }
}

function schedulePreview() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(fetchPreview, 300);
}

function wireLiveUpdates() {
  document.querySelectorAll("input").forEach(el => {
    el.addEventListener("input", schedulePreview);
  });
  document.querySelectorAll("select[data-key]").forEach(el => {
    el.addEventListener("change", schedulePreview);
  });
}

let _pollTimer = null;
let _currentJobId = null;

async function loadInputs(videoCsvHint, imageCsvHint) {
  const res = await fetch("/inputs");
  const csvs = await res.json();
  ["video-csv-select", "image-csv-select"].forEach((id, i) => {
    const hint = i === 0 ? videoCsvHint : imageCsvHint;
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">— select CSV —</option>';
    csvs.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
    if (hint) sel.value = hint;
  });
}

async function runJob(type) {
  const csvSel = document.getElementById(`${type}-csv-select`);
  const outputEl = document.getElementById(`${type}-output-path`);
  const csv = csvSel.value;
  if (!csv) { alert("Select an input CSV first."); return; }

  const logPanel = document.getElementById("log-panel");
  const logEl = document.getElementById("job-log");
  const badge = document.getElementById("job-status-badge");
  logPanel.style.display = "block";
  logEl.textContent = "";
  badge.textContent = "Starting…";
  badge.className = "updating";

  const runBtn = document.getElementById(`run-${type}-btn`);
  runBtn.disabled = true;

  try {
    const res = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, csv, output: outputEl.value.trim() }),
    });
    const data = await res.json();
    if (data.error) { badge.textContent = "Error: " + data.error; badge.className = "err"; runBtn.disabled = false; return; }
    _currentJobId = data.job_id;
    _pollTimer = setInterval(() => _pollJob(type), 1000);
  } catch (e) {
    badge.textContent = "Error: " + e.message;
    badge.className = "err";
    runBtn.disabled = false;
  }
}

async function _pollJob(type) {
  if (!_currentJobId) return;
  const res = await fetch(`/run/${_currentJobId}`);
  const job = await res.json();

  const logEl = document.getElementById("job-log");
  const badge = document.getElementById("job-status-badge");
  logEl.textContent = job.lines.join("\n");
  logEl.scrollTop = logEl.scrollHeight;

  if (job.status === "running") {
    badge.textContent = "Running…";
    badge.className = "updating";
  } else {
    badge.textContent = job.status === "done" ? "Done" : "Error";
    badge.className = job.status === "done" ? "ok" : "err";
    clearInterval(_pollTimer);
    _pollTimer = null;
    _currentJobId = null;
    document.getElementById(`run-${type}-btn`).disabled = false;
  }
}

async function loadFonts() {
  const res = await fetch("/fonts");
  const fonts = await res.json();
  const sel = document.getElementById("font-select");
  sel.innerHTML = "";
  fonts.forEach(f => {
    const opt = document.createElement("option");
    opt.value = f.path;
    opt.textContent = f.name;
    sel.appendChild(opt);
  });
  const current = currentValues["FONT_FILENAME"];
  if (current) sel.value = current;
}

function wireTabs() {
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.querySelector(`.tab-pane[data-pane="${btn.dataset.tab}"]`).classList.add("active");
    });
  });
}

async function saveConfig() {
  saveBtn.disabled = true;
  saveStatus.textContent = "Saving…";
  saveStatus.className = "status-line";

  const payload = {};
  ALL_KEYS.forEach(key => {
    const v = readKeyValue(key);
    if (v !== undefined && v !== null && v !== "") payload[key] = v;
  });

  try {
    const res = await fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (data.status === "ok") {
      saveStatus.textContent = "Saved · Backup: " + data.backup;
      saveStatus.className = "status-line ok";
    } else {
      saveStatus.textContent = "Save failed: " + (data.message || "unknown error");
      saveStatus.className = "status-line err";
    }
  } catch (e) {
    saveStatus.textContent = "Save failed: " + e.message;
    saveStatus.className = "status-line err";
  } finally {
    saveBtn.disabled = false;
  }
}

async function init() {
  wireTabs();
  wireLiveUpdates();
  saveBtn.addEventListener("click", saveConfig);
  document.getElementById("run-video-btn").addEventListener("click", () => runJob("video"));
  document.getElementById("run-image-btn").addEventListener("click", () => runJob("image"));

  let videoCsvHint = "", imageCsvHint = "";
  try {
    const res = await fetch("/config");
    const data = await res.json();
    Object.entries(data).forEach(([k, v]) => {
      if (!k.startsWith("_")) setKeyValue(k, v);
    });
    videoCsvHint = data._video_csv_filename || "";
    imageCsvHint = data._image_csv_filename || "";
    // Initialize frame-time controls from server metadata
    const duration = data._video_duration || 18;
    const defaultAt = data._default_at_time || 1.5;
    const slider = document.getElementById("frame-time-slider");
    const input = document.getElementById("frame-time-input");
    slider.max = Math.max(duration - 0.1, 1).toFixed(1);
    input.max = slider.max;
    input.min = 0;
    slider.value = defaultAt.toFixed(2);
    input.value = defaultAt.toFixed(2);
    // Keep the pair in sync
    slider.addEventListener("input", () => { input.value = slider.value; });
    input.addEventListener("input", () => { slider.value = input.value; });
  } catch (e) {
    saveStatus.textContent = "Could not load config: " + e.message;
    saveStatus.className = "status-line err";
    return;
  }
  await Promise.all([loadFonts(), loadInputs(videoCsvHint, imageCsvHint)]);
  fetchPreview();
}

init();
</script>

</body>
</html>
